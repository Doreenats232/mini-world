name: build-release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        run: echo "version=1.0.${{ github.run_number }}" >> $GITHUB_OUTPUT
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v${{ steps.v.outputs.version }}" --repo "${{ github.repository }}" --title "MiniWorld v${{ steps.v.outputs.version }}" --notes "Auto build ${{ github.sha }}" --target "${{ github.sha }}"
  exe:
    needs: prepare
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - run: npm version ${{ needs.prepare.outputs.version }} --no-git-tag-version --allow-same-version
      - run: npm run dist
      - shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "v${{ needs.prepare.outputs.version }}" release/MiniWorld-Setup.exe release/latest.yml release/MiniWorld-Setup.exe.blockmap --repo "${{ github.repository }}" --clobber
  apk:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - run: npm version ${{ needs.prepare.outputs.version }} --no-git-tag-version --allow-same-version
      - run: npm run build
      - run: |
          npx cap add android
          npx cap sync android
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"${{ needs.prepare.outputs.version }}\"/" android/app/build.gradle
          mkdir -p ~/.android && cp debug.keystore ~/.android/debug.keystore
          cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../MiniWorld.apk
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "v${{ needs.prepare.outputs.version }}" MiniWorld.apk --repo "${{ github.repository }}" --clobber
  pages:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - run: npm version ${{ needs.prepare.outputs.version }} --no-git-tag-version --allow-same-version
      - run: npm run build
      - run: echo '{"version":"${{ needs.prepare.outputs.version }}"}' > dist/version.json
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
      - id: d
        uses: actions/deploy-pages@v4
